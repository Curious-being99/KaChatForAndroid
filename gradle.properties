# Gradle JVM memory — prevents garbage collector thrashing
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Suppress the compileSdk=35 warning for AGP 8.5.2
android.suppressUnsupportedCompileSdk=35

# Kotlin code style
kotlin.code.style=official

# Enable AndroidX
android.useAndroidX=true

# R8 full-mode optimization — default-on in AGP 8+, set explicitly so the release build's
# shrinking/optimization is unambiguous (addresses Play's "R8 optimization" quality recommendation).
android.enableR8.fullMode=true
